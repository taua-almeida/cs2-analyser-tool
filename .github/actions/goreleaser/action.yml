name: Pinned GoReleaser
description: Run the repository's pinned GoReleaser release tool.

inputs:
  args:
    description: Arguments passed to GoReleaser.
    required: true

runs:
  using: composite
  steps:
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: v2.17.1
        args: ${{ inputs.args }}
