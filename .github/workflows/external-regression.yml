name: External regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Reject non-default refs
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::external regressions only run against the default branch $DEFAULT_BRANCH; ref $REF_NAME was rejected"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Provision checksum-pinned private fixtures
        id: private-fixtures
        shell: bash
        env:
          EXTERNAL_FIXTURE_ARCHIVE_URL: ${{ secrets.EXTERNAL_FIXTURE_ARCHIVE_URL }}
          EXTERNAL_FIXTURE_ARCHIVE_SHA256: ${{ vars.EXTERNAL_FIXTURE_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail

          fail_provisioning() {
            local reason=$1
            {
              echo "## External regression coverage"
              echo
              echo "- Eight map regressions ran: no"
              echo "- Series regression ran: no"
              echo "- Fixture checksums passed: no"
              echo "- No required tests skipped: not evaluated"
              echo "- Private Inferno golden: unavailable"
              echo "- Final test result: blocked by fixture provisioning"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          }

          if [[ -z "$EXTERNAL_FIXTURE_ARCHIVE_URL" || -z "$EXTERNAL_FIXTURE_ARCHIVE_SHA256" ]]; then
            fail_provisioning "external fixture configuration is absent; an owner must set the approved archive secret and checksum variable"
          fi
          if [[ "$EXTERNAL_FIXTURE_ARCHIVE_URL" != https://* || "$EXTERNAL_FIXTURE_ARCHIVE_URL" == *$'\n'* ]]; then
            fail_provisioning "the approved fixture archive secret must contain one HTTPS URL"
          fi
          if [[ ! "$EXTERNAL_FIXTURE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            fail_provisioning "the external fixture archive checksum variable must be a lowercase SHA-256 digest"
          fi

          archive_path="$RUNNER_TEMP/external-fixtures.tar.gz"
          fixture_root="$RUNNER_TEMP/external-fixtures"
          mkdir -p "$fixture_root"

          if ! curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive_path" "$EXTERNAL_FIXTURE_ARCHIVE_URL" \
            2> "$RUNNER_TEMP/external-fixture-download.err"; then
            fail_provisioning "the approved external fixture archive could not be downloaded"
          fi
          if ! printf '%s  %s\n' "$EXTERNAL_FIXTURE_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --status; then
            fail_provisioning "the external fixture archive checksum did not match"
          fi

          declare -A seen_paths=()
          required_verified=0
          optional_entries=0
          private_inferno=false
          while read -r requirement expected_checksum relative_path extra; do
            if [[ -z "${requirement:-}" ]]; then
              continue
            fi
            if [[ -n "${extra:-}" || ! "$requirement" =~ ^(required|optional)$ || ! "$expected_checksum" =~ ^[0-9a-f]{64}$ ]]; then
              fail_provisioning "the committed external fixture manifest is malformed"
            fi
            if [[ ! "$relative_path" =~ ^(hltv-original|hltv-extra|private-golden)/[A-Za-z0-9._-]+\.dem$ ]]; then
              fail_provisioning "the committed external fixture manifest contains an unsafe path"
            fi
            if [[ -n "${seen_paths[$relative_path]+present}" ]]; then
              fail_provisioning "the committed external fixture manifest contains a duplicate path"
            fi
            seen_paths["$relative_path"]=1

            if [[ "$requirement" == "optional" ]]; then
              ((optional_entries += 1))
            fi
            if ! tar --list --gzip --file="$archive_path" --no-wildcards "$relative_path" >/dev/null 2>&1; then
              if [[ "$requirement" == "optional" ]]; then
                continue
              fi
              fail_provisioning "the approved archive is missing required fixture $relative_path"
            fi

            destination="$fixture_root/$relative_path"
            mkdir -p "${destination%/*}"
            if ! tar --extract --gzip --to-stdout --file="$archive_path" --no-wildcards "$relative_path" > "$destination"; then
              fail_provisioning "fixture $relative_path could not be read from the approved archive"
            fi
            if ! printf '%s  %s\n' "$expected_checksum" "$destination" | sha256sum --check --status; then
              fail_provisioning "fixture $relative_path did not match its pinned checksum"
            fi

            if [[ "$requirement" == "required" ]]; then
              ((required_verified += 1))
            elif [[ "$relative_path" == "private-golden/inferno-shotgun.dem" ]]; then
              private_inferno=true
            fi
          done < .github/external-fixtures.sha256

          if (( required_verified != 8 || optional_entries != 1 )); then
            fail_provisioning "the committed external fixture manifest does not define eight required demos and one optional private golden"
          fi

          if [[ "$private_inferno" == "true" ]]; then
            if [[ -e analysis/testdata/inferno-shotgun.dem || -L analysis/testdata/inferno-shotgun.dem ]]; then
              fail_provisioning "the private golden target path is unexpectedly occupied"
            fi
            ln -s "$fixture_root/private-golden/inferno-shotgun.dem" analysis/testdata/inferno-shotgun.dem
            echo "REQUIRE_PRIVATE_TEST_DEMO=1" >> "$GITHUB_ENV"
          fi
          printf 'fixture_root=%s\n' "$fixture_root" >> "$GITHUB_OUTPUT"
          printf 'private_inferno=%s\n' "$private_inferno" >> "$GITHUB_OUTPUT"

      - name: Download public golden fixtures
        run: make download-test-demos

      - name: Unit, synthetic, and golden tests
        shell: bash
        env:
          REQUIRE_TEST_DEMO: "1"
        run: |
          results="$RUNNER_TEMP/external-core-go-test.json"

          set +e
          set -o pipefail
          go test -count=1 -json ./... | tee "$results" >/dev/null
          pipeline_status=("${PIPESTATUS[@]}")
          go run ./internal/citest -profile pull-request < "$results"
          report_status=$?
          set -e

          if (( pipeline_status[0] != 0 || pipeline_status[1] != 0 || report_status != 0 )); then
            exit 1
          fi

      - name: Required HLTV map and series regressions
        shell: bash
        env:
          HLTV_DEMO_DIR: ${{ steps.private-fixtures.outputs.fixture_root }}/hltv-original
          HLTV_EXTRA_DEMO_DIRS: ${{ steps.private-fixtures.outputs.fixture_root }}/hltv-extra
          REQUIRE_HLTV_DEMOS: "1"
          REQUIRE_HLTV_EXTRA_DEMOS: "1"
        run: |
          results="$RUNNER_TEMP/external-go-test.json"

          set +e
          set -o pipefail
          go test -count=1 -json ./analysis \
            -run '^(TestHLTVRegression|TestHLTVSeriesRegression)$' | tee "$results" >/dev/null
          pipeline_status=("${PIPESTATUS[@]}")
          go run ./internal/citest -profile external -fixtures-verified < "$results"
          report_status=$?
          set -e

          if (( pipeline_status[0] != 0 || pipeline_status[1] != 0 || report_status != 0 )); then
            exit 1
          fi
