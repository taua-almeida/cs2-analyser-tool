name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore test demo fixture
        id: demo-cache
        uses: actions/cache@v6
        with:
          path: cmd/demo_parser/testdata/test_demo.dem
          key: test-demo-84a1a4191302bdd2a3bbb5a727842093744b1fb1a228aeec630369e44b622cb2
      - name: Download test demo fixture
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: make download-test-demo
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
        env:
          # Fail rather than skip if the fixture never made it into place.
          REQUIRE_TEST_DEMO: "1"
